<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><title>Proposta · SIGS</title><link rel="stylesheet" href="assets/css/brand-v23.css?v=20261006-0715"><script src="assets/js/brand-v23.js?v=20261006-0715"></script><script src="assets/js/site-geometry-model-v28.js?v=20261006-0715"></script><script src="assets/js/proposal-optics-v27.js?v=20261006-0715"></script><script src="assets/js/quote-view-v12.js?v=20261006-0715"></script><link rel="icon" type="image/svg+xml" href="assets/brand/sigs-favicon.svg"></head><body><div class="q-toolbar"><b>SIGS · Proposta para cliente</b> <button id="print" type="button" disabled>Imprimir / PDF</button></div><div id="status" class="q-status" role="status">A carregar proposta…</div><main id="quote"></main><section id="response" class="q-response" hidden><h2>Responder à proposta</h2><label>O teu nome<input id="name" autocomplete="name" maxlength="160" minlength="2" required></label><label>Observações<textarea id="note" rows="3" maxlength="3000"></textarea></label><label><input type="checkbox" id="consent"> Confirmo que revi esta proposta e pretendo registar a resposta indicada.</label><p>A resposta regista o nome e a data. Não é uma assinatura digital.</p><button type="button" data-response="ACCEPTED">Aceitar proposta</button><button type="button" data-response="CHANGES">Pedir alteração</button><button type="button" data-response="DECLINED">Recusar</button></section>
<script>
(function(){'use strict';const style=document.createElement('style');style.textContent=SIGSQuoteView.style;document.head.appendChild(style);const $=id=>document.getElementById(id),token=new URLSearchParams(location.hash.slice(1)).get('token')||'',cfg={url:'https://kbihedvyykjlbnipdgfm.supabase.co',key:'sb_publishable_7iaBGJr6qS-YO1HOySsKUQ_vCxOU52o'};let busy=false;
async function rpc(name,body){const r=await fetch(cfg.url+'/rest/v1/rpc/'+name,{method:'POST',headers:{apikey:cfg.key,'Content-Type':'application/json'},body:JSON.stringify(body),referrerPolicy:'no-referrer'});if(!r.ok)throw Error('Não foi possível concluir o pedido. Tenta novamente.');return r.json();}
async function load(){if(!/^[a-f0-9]{64}$/.test(token))throw Error('Link inválido.');const data=await rpc('sigs_public_quote',{p_token:token});if(!data||!data.snapshot)throw Error('Proposta indisponível, expirada ou revogada.');$('quote').innerHTML=SIGSQuoteView.markup(data.snapshot);$('print').disabled=false;$('print').onclick=()=>window.print();$('status').textContent=data.response?'Resposta já registada: '+({ACCEPTED:'aceite',CHANGES:'alteração pedida',DECLINED:'recusada'}[data.response]||data.response):'Link válido até '+new Date(data.expires_at).toLocaleDateString('pt-PT');$('response').hidden=!!data.response;}
document.querySelectorAll('[data-response]').forEach(b=>b.onclick=async()=>{if(busy)return;if(!$('consent').checked||!$('name').checkValidity()){$('status').textContent='Indica o teu nome e confirma que reveste a proposta.';$('name').reportValidity();return;}busy=true;document.querySelectorAll('[data-response]').forEach(b=>b.disabled=true);try{const ok=await rpc('sigs_respond_quote',{p_token:token,p_response:b.dataset.response,p_name:$('name').value.trim(),p_note:$('note').value});if(!ok)throw Error('Link indisponível ou resposta já registada.');await load();}catch(e){$('status').textContent=e.message;}finally{busy=false;document.querySelectorAll('[data-response]').forEach(b=>b.disabled=false);}});load().catch(e=>{$('status').textContent=e.message;});})();
</script></body></html>
